<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200">
  <defs>
    <!-- Background Wafer/Die Grid -->
    <pattern id="wafer-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161B22" stroke-width="0.8" />
    </pattern>

    <!-- Crimson Slash Gradients -->
    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E4D" stop-opacity="0" />
      <stop offset="45%" stop-color="#FF2E4D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="55%" stop-color="#FF2E4D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B1D2C" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .telemetry-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    
    @keyframes slash-pulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #FF2E4D); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #FF2E4D); }
    }

    @keyframes status-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .slash-edge {
      animation: slash-pulse 2.2s infinite ease-in-out;
    }

    .crimson-dot {
      animation: status-blink 1.8s infinite ease-in-out;
    }
  </style>

  <!-- Dark Canvas Base (#0D1117) -->
  <rect x="0" y="0" width="920" height="200" fill="#0D1117" rx="6" />
  <rect x="0" y="0" width="920" height="200" fill="url(#wafer-grid)" rx="6" />

  <!-- Manga Panel Outer Border -->
  <rect x="1" y="1" width="918" height="198" fill="none" stroke="#30363D" stroke-width="1.5" rx="6" />

  <!-- Corner Brackets -->
  <path d="M 8 24 L 8 8 L 24 8" fill="none" stroke="#FF2E4D" stroke-width="2" />
  <path d="M 896 8 L 912 8 L 912 24" fill="none" stroke="#FF2E4D" stroke-width="2" />
  <path d="M 8 176 L 8 192 L 24 192" fill="none" stroke="#FF2E4D" stroke-width="2" />
  <path d="M 896 192 L 912 192 L 912 176" fill="none" stroke="#FF2E4D" stroke-width="2" />

  <!-- Header Status Bar -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="6" r="3.5" fill="#FF2E4D" class="crimson-dot" />
    <text x="18" y="10" fill="#FF2E4D" font-size="10" font-weight="700" letter-spacing="1.5" class="telemetry-mono">APPLIED AI // LLM APPS · AGENTS · EVALS</text>
    <text x="540" y="10" fill="#8B949E" font-size="9.5" font-weight="600" class="telemetry-mono">SHIPPED FIXES IN VLLM &amp; OPEN SOURCE</text>
  </g>

  <!-- Identity Section (Left) -->
  <g transform="translate(32, 54)">
    <!-- Identity Name -->
    <text x="0" y="44" fill="#E6EDF3" font-size="36" font-weight="900" letter-spacing="2.5" class="telemetry-mono">dev tyagi</text>

    <!-- Subtitle Pill -->
    <rect x="235" y="20" width="205" height="24" rx="3" fill="#FF2E4D" fill-opacity="0.12" stroke="#FF2E4D" stroke-width="1" />
    <text x="246" y="36" fill="#FF2E4D" font-size="10.5" font-weight="700" letter-spacing="0.8" class="telemetry-mono">APPLIED AI ENGINEER</text>

    <!-- Exact Required Headline -->
    <text x="0" y="78" fill="#8B949E" font-size="12" font-weight="500" class="telemetry-mono">applied ai engineer · llm apps, agents, evals · shipped fixes in vllm</text>
  </g>

  <!-- Manga Illustration Inset Panel (Right side) -->
  <g transform="translate(620, 36)">
    <!-- Angled Manga Panel Sub-frame -->
    <polygon points="12,0 264,0 252,108 0,108" fill="#161B22" fill-opacity="0.55" stroke="#30363D" stroke-width="1.2" />
    <polygon points="14,2 262,2 250,106 2,106" fill="none" stroke="#FF2E4D" stroke-opacity="0.25" stroke-width="0.8" />

    <!-- Authentic Kanji Watermark: 斬 (Zan - Slash) -->
    <text x="136" y="82" font-size="78" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Songti SC', 'MS Mincho', serif" font-weight="900" fill="#FF2E4D" fill-opacity="0.16" text-anchor="middle">斬</text>

    <!-- Manga Speedlines -->
    <line x1="255" y1="8" x2="25" y2="102" stroke="#E6EDF3" stroke-opacity="0.12" stroke-width="1" />
    <line x1="225" y1="2" x2="60" y2="106" stroke="#FF2E4D" stroke-opacity="0.2" stroke-width="1.2" />
    <line x1="200" y1="2" x2="10" y2="104" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.8" />

    <!-- Katana Slash Arc -->
    <path d="M 16 100 Q 115 65 248 16" fill="none" stroke="url(#slash-grad)" stroke-width="2.5" class="slash-edge" filter="url(#crimson-glow)" />
    <path d="M 28 95 Q 65 82 100 74 T 175 46 T 235 22" fill="none" stroke="#FF2E4D" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.75" />

    <!-- Manga Corner Indicators -->
    <path d="M 22 10 L 22 4 L 32 4" fill="none" stroke="#FF2E4D" stroke-width="1.5" />
    <path d="M 238 104 L 248 104 L 248 98" fill="none" stroke="#FF2E4D" stroke-width="1.5" />

    <text x="246" y="16" fill="#8B949E" font-size="8.5" font-weight="700" letter-spacing="1" class="telemetry-mono" text-anchor="end">GENAI // 01</text>
  </g>

  <!-- Bottom Proof Strip -->
  <g transform="translate(32, 156)">
    <rect x="0" y="0" width="856" height="24" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="14" y="16" fill="#FF2E4D" font-size="9.5" font-weight="700" letter-spacing="1" class="telemetry-mono">UPSTREAM MERGED:</text>
    <text x="146" y="16" fill="#E6EDF3" font-size="9.5" font-weight="500" class="telemetry-mono">vllm (#56635) · cva6 (#3518) · riscv-dbg (#206, #204) · open: sglang (#45031)</text>
    <text x="734" y="16" fill="#00FF9C" font-size="9.5" font-weight="700" letter-spacing="0.5" class="telemetry-mono">&#9733; 1st sandisk</text>
  </g>
</svg>
