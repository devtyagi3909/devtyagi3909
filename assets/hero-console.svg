<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#131c2e" stroke-width="0.7" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(150px); opacity: 0.1; }
    }

    @keyframes wire-flow {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }

    .dot {
      transform-origin: 35px 23px;
      animation: pulse-dot 2s infinite ease-in-out;
    }

    .scanner {
      animation: scan 4s linear infinite;
    }

    .flow {
      stroke-dasharray: 4 3;
      animation: wire-flow 1.2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect x="0" y="0" width="900" height="160" fill="#070a12" rx="8" />
  <rect x="0" y="0" width="900" height="160" fill="url(#grid)" rx="8" />
  <rect x="1" y="1" width="898" height="158" fill="none" stroke="#1b253b" stroke-width="1.2" rx="8" />

  <!-- Corner Brackets -->
  <path d="M 6 20 L 6 6 L 20 6" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 880 6 L 894 6 L 894 20" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 6 140 L 6 154 L 20 154" fill="none" stroke="#00ff9c" stroke-width="2" />
  <path d="M 880 154 L 894 154 L 894 140" fill="none" stroke="#00ff9c" stroke-width="2" />

  <!-- Scanline -->
  <line x1="6" y1="6" x2="894" y2="6" stroke="#38bdf8" stroke-width="1.2" class="scanner" />

  <!-- Top Status Line -->
  <g transform="translate(25, 15)">
    <circle cx="10" cy="8" r="3.5" fill="#00ff9c" class="dot" filter="url(#glow-green)" />
    <text x="22" y="11" fill="#00ff9c" font-size="10" font-weight="700" letter-spacing="1.2" class="mono">online // devtyagi3909</text>
    <text x="680" y="11" fill="#64748b" font-size="9.5" font-weight="600" class="mono">tty0 · 43 repos · rocm/cuda</text>
  </g>

  <!-- Main Hero Block (Generous Spacing to Prevent Overlap) -->
  <g transform="translate(35, 42)">
    <!-- Name -->
    <text x="0" y="34" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="2" class="mono">dev tyagi</text>
    
    <!-- Badge Pill safely offset to x=185 -->
    <rect x="185" y="16" width="185" height="22" rx="4" fill="#00ff9c" fill-opacity="0.08" stroke="#00ff9c" stroke-width="1" />
    <text x="195" y="31" fill="#00ff9c" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">systems &amp; ai infra</text>

    <!-- Subtitle -->
    <text x="0" y="58" fill="#94a3b8" font-size="12" font-weight="500" class="mono">silicon pipelines <tspan fill="#38bdf8">──►</tspan> custom kernels <tspan fill="#38bdf8">──►</tspan> distributed inference</text>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <g transform="translate(25, 120)">
    <rect x="0" y="0" width="850" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="16" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1" class="mono">UPSTREAM:</text>
    <text x="88" y="16" fill="#cbd5e1" font-size="10" font-weight="500" class="mono">vllm · sglang · transformers · openhw cva6 · pulp riscv-dbg</text>
    <text x="700" y="16" fill="#f97316" font-size="9.5" font-weight="700" letter-spacing="0.5" class="mono">&#9733; 1st sandisk hackathon</text>
  </g>
</svg>
