  <text x="696" y="47" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ffffff" fill-opacity="0.9">axi4_dma_engine.sv</text>
  <text x="1040" y="47" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#ff6a33" fill-opacity="0.65">ZYNQ-7000</text>
  <rect x="634" y="58" width="36" height="326" fill="#080808"/>
