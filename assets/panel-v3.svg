<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Dev Tyagi">
<defs>
  <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="14%" stop-color="#ffffff"/>
    <stop offset="86%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <mask id="cm"><rect width="574" height="356" fill="url(#vfade)"/></mask>
  <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000000"/>
    <stop offset="8%" stop-color="#ffffff"/>
    <stop offset="92%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <mask id="tm"><rect width="430" height="76" fill="url(#hfade)"/></mask>
  <clipPath id="cc"><rect width="574" height="356"/></clipPath>
  <clipPath id="tc"><rect width="430" height="76"/></clipPath>
  <clipPath id="wc"><rect x="686" y="430" width="510" height="128"/></clipPath>
</defs>

<rect width="600" height="600" fill="#050505"/>

<!-- Scan lines: use fill-opacity not rgba -->
<line x1="0" y1="80"  x2="1240" y2="80"  stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="160" x2="1240" y2="160" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="240" x2="1240" y2="240" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="320" x2="1240" y2="320" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="400" x2="1240" y2="400" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="480" x2="1240" y2="480" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>
<line x1="0" y1="560" x2="1240" y2="560" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.025"/>

<!-- Borders -->
<rect x="0"    y="0" width="3"    height="600" fill="#cc3d10" fill-opacity="0.75"/>
<rect x="597" y="0" width="3"    height="600" fill="#cc3d10" fill-opacity="0.9"/>
<rect x="0"    y="0" width="600" height="2"   fill="#cc3d10" fill-opacity="0.9"/>
<rect x="0"  y="598" width="600" height="2"   fill="#cc3d10" fill-opacity="0.9"/>

<!-- Corner brackets -->
<g stroke="#cc3d10" stroke-width="1.5" fill="none" stroke-opacity="0.6">
  <line x1="28"   y1="586" x2="28"   y2="572"/>
  <line x1="28"   y1="586" x2="42"   y2="586"/>
  <line x1="1212" y1="586" x2="1212" y2="572"/>
  <line x1="1212" y1="586" x2="1198" y2="586"/>
</g>

<!-- ====== LEFT TEXT PANEL ====== -->

<!-- Accent bar -->
<g opacity="1">
  
  <rect x="28" y="54" width="64" height="2" fill="#cc3d10"/>
</g>

<!-- Eyebrow -->
<g opacity="1">
  
  <text x="28" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#cc3d10" letter-spacing="3">FPGA / RTL DESIGN ENGINEER</text>
</g>

<!-- Name with glitch shadows -->
<g opacity="1">
  
  <text x="24" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="56" fill="#cc3d10" font-weight="700" letter-spacing="-2" fill-opacity="0.22">Dev Tyagi</text>
  <text x="32" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="56" fill="#1e4db7" font-weight="700" letter-spacing="-2" fill-opacity="0.22">Dev Tyagi</text>
  <text x="28" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="56" fill="#f4f4f5" font-weight="700" letter-spacing="-2">Dev Tyagi</text>
  <text x="348" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="56" fill="#cc3d10" font-weight="700">.</text>
</g>

<!-- Role -->
<text x="28" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#f4f4f5" letter-spacing="1" opacity="1">
  FPGA  ·  AI Accelerator  ·  RTL Engineer
  
</text>

<!-- Stack lines: use fill + fill-opacity NOT rgba() -->
<text x="28" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="1" font-weight="700">
  Architectural Contributor @ OpenHW Group · chipsalliance · lowRISC
</text>
<text x="28" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.9">
  Merged Patches: CVA6 · RISC-V Debug · Spike Simulator
</text>
<text x="28" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.9">
  Under Review: Rocket Chip · OpenTitan · VeeR · CV32E40P · Ibex
</text>
<text x="28" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#f4f4f5" fill-opacity="0.6">
  Skills: SystemVerilog · Chisel · UVM · C/C++ · RISC-V Arch
</text>
<text x="28" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#f4f4f5" fill-opacity="0.28">
  B.TECH ECM  ·  VIT CHENNAI  ·  INDIA
</text>

<!-- Divider -->
<g opacity="1">
  
  <line x1="28" y1="340" x2="590" y2="340" stroke="#cc3d10" stroke-width="2" stroke-opacity="0.8"/>
</g>

<!-- Status dot + text -->
<g opacity="1">
  
  <circle cx="34" cy="368" r="5" fill="#cc3d10">
    
  </circle>
  <text x="48" y="373" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#f4f4f5" font-weight="700">Open to internships &amp; contract work in hardware/AI</text>
  <text x="28" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#f4f4f5" fill-opacity="0.35" letter-spacing="1">FPGA · EMBEDDED AI · RISC-V · RTL DESIGN · RESEARCH</text>
</g>

<!-- Terminal scroll -->
<g opacity="1">
  
  <text x="28" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#ff6a33" letter-spacing="2">$ gh pr list --author "devtyagi3909" --state merged,open</text>
  <rect x="28" y="436" width="450" height="86" fill="#0a0a0a" stroke="#ff6a33" stroke-width="1" stroke-opacity="0.4"/>
  <g transform="translate(28,436)">
    <!-- Line 1 -->
    <text x="12" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#10b981" font-weight="700" opacity="0">
      [MERGED] openhwgroup/cva6#3518: fix rvfi bounds
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.5s" fill="freeze"/>
    </text>
    <!-- Line 2 -->
    <text x="12" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#10b981" font-weight="700" opacity="0">
      [MERGED] pulp-platform/riscv-dbg#204: fix hartsel
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.5s" fill="freeze"/>
    </text>
    <!-- Line 3 -->
    <text x="12" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#fbbf24" font-weight="700" opacity="0">
      [OPEN] chipsalliance/rocket-chip#3823: hedeleg mask
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.5s" fill="freeze"/>
    </text>
    <!-- Line 4 -->
    <text x="12" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#fbbf24" font-weight="700" opacity="0">
      [OPEN] riscv-software-src/riscv-isa-sim#2411: smdbltrp
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.5s" fill="freeze"/>
    </text>
    <!-- Cursor -->
    <rect x="350" y="65" width="6" height="12" fill="#ff6a33" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" begin="4s"/>
    </rect>
  </g>
</g>

</svg>
