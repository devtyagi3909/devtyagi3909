    </mask>
    <clipPath id="code-clip">
      <rect x="0" y="0" width="546" height="340" rx="6"/>
    </clipPath>
    <clipPath id="term-clip">
      <rect x="0" y="0" width="430" height="80" rx="4"/>
    </clipPath>
    <clipPath id="wave-clip">
