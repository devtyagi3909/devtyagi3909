<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Dev Tyagi — FPGA · AI Accelerator · Embedded Systems">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a6cff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#1a6cff" stop-opacity="0"/>
