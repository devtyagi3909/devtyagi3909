    font-size="16" fill="#e8eefc" opacity="0">
    FPGA  ·  AI Accelerator  ·  RTL Engineer
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.07;0.12;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Stack 1 -->
