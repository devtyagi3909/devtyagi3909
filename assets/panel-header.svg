      <text x="8" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#3d5278">rst</text>
      <text x="8" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#3d5278">result</text>
      <text x="8" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#3d5278">dbus_we</text>
      <line x1="50" y1="28" x2="50" y2="152" stroke="#1b2740" stroke-width="1"/>
      <!-- Waveforms -->
      <g clip-path="url(#wave-clip)">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; -48 0" dur="1.5s" repeatCount="indefinite"/>
          <path d="M52,58 L52,42 L76,42 L76,58 L100,58 L100,42 L124,42 L124,58 L148,58 L148,42 L172,42 L172,58 L196,58 L196,42 L220,42 L220,58 L244,58 L244,42 L268,42 L268,58 L292,58 L292,42 L316,42 L316,58 L340,58 L340,42 L364,42 L364,58 L388,58 L388,42 L412,42 L412,58 L436,58 L436,42 L460,42 L460,58 L484,58 L484,42 L508,42 L508,58 L532,58 L532,42 L556,42 L556,58 L580,58 L580,42 L604,42 L604,58"
            stroke="#1a6cff" stroke-width="1.8" fill="none" opacity="0.85"/>
          <path d="M52,83 L64,83 L64,68 L80,68 L80,83 L604,83"
            stroke="#f7768e" stroke-width="1.8" fill="none" opacity="0.7"/>
          <path d="M52,108 L80,108 L80,95 L84,95 L84,108 L240,108 L240,95 L244,95 L244,108 L400,108 L400,95 L404,95 L404,108 L560,108 L560,95 L564,95 L564,108"
            stroke="#00d4ff" stroke-width="1.8" fill="none" opacity="0.7"/>
          <path d="M52,133 L236,133 L236,120 L248,120 L248,133 L396,133 L396,120 L408,120 L408,133 L560,133"
            stroke="#9ece6a" stroke-width="1.8" fill="none" opacity="0.65"/>
        </g>
      </g>
      <!-- Cursor -->
      <line x1="220" y1="30" x2="220" y2="150" stroke="#1a6cff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0; 48 0; 0 0" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Circuit accent dots -->
  <g opacity="0.35">
    <circle cx="40" cy="582" r="2" fill="#1a6cff"/>
    <circle cx="60" cy="582" r="2" fill="#1a6cff"/>
    <circle cx="80" cy="582" r="2" fill="#1a6cff"/>
    <line x1="40" y1="582" x2="80" y2="582" stroke="#1a6cff" stroke-width="0.8"/>
    <line x1="80" y1="582" x2="80" y2="562" stroke="#1a6cff" stroke-width="0.8"/>
