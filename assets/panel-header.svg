    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
    font-size="14" fill="#6a8ab8" opacity="0">
    Verilog  ·  SystemVerilog  ·  C  ·  Python  ·  RISC-V
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.16;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Stack 2 -->
  <text x="40" y="230"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
    font-size="13.5" fill="#6a8ab8" opacity="0">
    FPGA Toolchains · Embedded AI · MicroPython · Assembly
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.20;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Stack 3 -->
  <text x="40" y="258"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
    font-size="13.5" fill="#6a8ab8" opacity="0">
    Systolic Arrays · HLS · SLG47910 ForgeFPGA · ns-3
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.24;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Stack 4 -->
  <text x="40" y="286"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
    font-size="13.5" fill="#6a8ab8" opacity="0">
    CAN Bus · Wi-Fi 7 · MLO · Network Simulation
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.28;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Location -->
