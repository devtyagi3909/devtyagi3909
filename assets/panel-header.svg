  <text x="5"  y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="rgba(244,244,245,0.38)">awvalid</text>
  <text x="5"  y="133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="rgba(244,244,245,0.38)">wready</text>
  <text x="5"  y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="rgba(244,244,245,0.38)">irq</text>
  <g clip-path="url(#wc)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-48 0" dur="1.4s" repeatCount="indefinite"/>
      <!-- aclk -->
