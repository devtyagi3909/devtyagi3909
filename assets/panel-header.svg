<g transform="translate(634,28)">
  <rect x="0" y="0" width="574" height="356" fill="#0a0a0a" stroke="#cc3d10" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="574" height="30" fill="#0d0d0d"/>
  <line x1="0" y1="30" x2="574" y2="30" stroke="#cc3d10" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="16" cy="15" r="4.5" fill="#cc3d10" opacity="0.75"/>
  <circle cx="30" cy="15" r="4.5" fill="#cc3d10" opacity="0.35"/>
  <circle cx="44" cy="15" r="4.5" fill="#cc3d10" opacity="0.15"/>
  <text x="62" y="19" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="rgba(244,244,245,0.5)" letter-spacing="0.5">axi4_dma_engine.sv</text>
  <text x="410" y="19" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#cc3d10" opacity="0.65" letter-spacing="1">ZYNQ-7000</text>
  <!-- Gutter -->
  <rect x="0" y="30" width="36" height="326" fill="#080808"/>
  <line x1="36" y1="30" x2="36" y2="356" stroke="#cc3d10" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Scrolling code -->
  <g clip-path="url(#cc)" mask="url(#cm)">
  <g transform="translate(0,30)">
    <animateTransform attributeName="transform" type="translate" values="0 30;0 -680" dur="34s" repeatCount="indefinite"/>
    <!-- Line numbers -->
    <text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#cc3d10" opacity="0.3">
      <tspan x="8" y="14">1</tspan><tspan x="8" dy="17">2</tspan><tspan x="8" dy="17">3</tspan><tspan x="8" dy="17">4</tspan><tspan x="8" dy="17">5</tspan><tspan x="8" dy="17">6</tspan><tspan x="8" dy="17">7</tspan><tspan x="8" dy="17">8</tspan><tspan x="8" dy="17">9</tspan><tspan x="5" dy="17">10</tspan><tspan x="5" dy="17">11</tspan><tspan x="5" dy="17">12</tspan><tspan x="5" dy="17">13</tspan><tspan x="5" dy="17">14</tspan><tspan x="5" dy="17">15</tspan><tspan x="5" dy="17">16</tspan><tspan x="5" dy="17">17</tspan><tspan x="5" dy="17">18</tspan><tspan x="5" dy="17">19</tspan><tspan x="5" dy="17">20</tspan><tspan x="5" dy="17">21</tspan><tspan x="5" dy="17">22</tspan><tspan x="5" dy="17">23</tspan><tspan x="5" dy="17">24</tspan><tspan x="5" dy="17">25</tspan><tspan x="5" dy="17">26</tspan><tspan x="5" dy="17">27</tspan><tspan x="5" dy="17">28</tspan><tspan x="5" dy="17">29</tspan><tspan x="5" dy="17">30</tspan><tspan x="5" dy="17">31</tspan><tspan x="5" dy="17">32</tspan><tspan x="5" dy="17">33</tspan><tspan x="5" dy="17">34</tspan><tspan x="5" dy="17">35</tspan><tspan x="5" dy="17">36</tspan><tspan x="5" dy="17">37</tspan><tspan x="5" dy="17">38</tspan><tspan x="5" dy="17">39</tspan><tspan x="5" dy="17">40</tspan><tspan x="5" dy="17">41</tspan><tspan x="5" dy="17">42</tspan><tspan x="5" dy="17">43</tspan><tspan x="5" dy="17">44</tspan><tspan x="5" dy="17">45</tspan>
    </text>
    <!-- Code: AXI4 DMA Engine -->
    <text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5">
      <tspan x="44" y="14" fill="#cc3d10">// AXI4 DMA Engine &#8212; Zynq-7000  1GB/s burst mode</tspan>
      <tspan x="44" dy="17" fill="rgba(244,244,245,0.35)">// interrupt-driven &#183; AXI4-MM + AXI-Stream endpoints</tspan>
      <tspan x="44" dy="17"/>
      <tspan x="44" dy="17" fill="#1e4db7">module </tspan><tspan fill="#f4f4f5">axi4_dma_engine #(</tspan>
      <tspan x="44" dy="17" fill="#cc3d10">  parameter </tspan><tspan fill="#f4f4f5">DATA_W    = 64,</tspan>
      <tspan x="44" dy="17" fill="#cc3d10">  parameter </tspan><tspan fill="#f4f4f5">BURST_LEN = 256,</tspan>
      <tspan x="44" dy="17" fill="#cc3d10">  parameter </tspan><tspan fill="#f4f4f5">ADDR_W    = 32</tspan>
      <tspan x="44" dy="17" fill="#f4f4f5">) (</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire              aclk, aresetn,</tspan>
      <tspan x="44" dy="17" fill="rgba(244,244,245,0.35)">  // AXI4-MM Master write channel</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire [ADDR_W-1:0] m_axi_awaddr,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire [7:0]        m_axi_awlen,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire [2:0]        m_axi_awsize,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire [DATA_W-1:0] m_axi_wdata,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire              m_axi_wvalid,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire              m_axi_wready,</tspan>
      <tspan x="44" dy="17" fill="rgba(244,244,245,0.35)">  // AXI-Stream slave</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire [DATA_W-1:0] s_axis_tdata,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire              s_axis_tvalid,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire              s_axis_tready,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire              irq</tspan>
      <tspan x="44" dy="17" fill="#f4f4f5">);</tspan>
      <tspan x="44" dy="17"/>
      <tspan x="44" dy="17" fill="rgba(244,244,245,0.35)">  // Outstanding transaction tracker</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  reg  </tspan><tspan fill="#f4f4f5">[7:0] txn_cnt;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  reg       </tspan><tspan fill="#f4f4f5">irq_r;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  always </tspan><tspan fill="#f4f4f5">@(posedge aclk)</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">    if    </tspan><tspan fill="#f4f4f5">(!aresetn) txn_cnt &lt;= </tspan><tspan fill="#cc3d10">8&#39;d0</tspan><tspan fill="#f4f4f5">;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">    else if </tspan><tspan fill="#f4f4f5">(issue)   txn_cnt &lt;= txn_cnt + </tspan><tspan fill="#cc3d10">1</tspan><tspan fill="#f4f4f5">;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">    else if </tspan><tspan fill="#f4f4f5">(done)    txn_cnt &lt;= txn_cnt - </tspan><tspan fill="#cc3d10">1</tspan><tspan fill="#f4f4f5">;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  assign </tspan><tspan fill="#f4f4f5">irq = irq_r;</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">endmodule</tspan>
      <tspan x="44" dy="24" fill="#cc3d10">// OoO Superscalar RISC-V &#8212; SanDisk 1st Place</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">module </tspan><tspan fill="#f4f4f5">rob_entry (</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire [4:0]  tag,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire [31:0] result,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  input  </tspan><tspan fill="#f4f4f5">wire        complete,</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  output </tspan><tspan fill="#f4f4f5">wire        commit</tspan>
      <tspan x="44" dy="17" fill="#f4f4f5">);</tspan>
      <tspan x="44" dy="17" fill="rgba(244,244,245,0.35)">  // Tomasulo &#183; ROB &#183; CDB &#183; 7-stage &#183; 250 MHz</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">  assign </tspan><tspan fill="#f4f4f5">commit = complete &amp;&amp; (tag == head);</tspan>
      <tspan x="44" dy="17" fill="#1e4db7">endmodule</tspan>
    </text>
  </g>
  </g>
</g>
</g>

