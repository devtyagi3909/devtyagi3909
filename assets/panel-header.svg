    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.05;1" dur="24s" fill="freeze"/>
    <rect x="40" y="68" width="56" height="3" rx="1.5" fill="url(#accent-line)"/>
  </g>

  <!-- Name -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.025;0.07;1" dur="24s" fill="freeze"/>
    <text x="40" y="132"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
      font-size="40" fill="#e8eefc" font-weight="700">Dev Tyagi</text>
  </g>

  <!-- Role -->
