    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
    font-size="13" fill="#3d5278" opacity="0">
    B.Tech ECM  ·  VIT Chennai  ·  India
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="24s" fill="freeze"/>
  </text>

  <!-- Status section -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.38;1" dur="24s" fill="freeze"/>
    <rect x="40" y="354" width="520" height="1" fill="#1b2740"/>
    <circle cx="46" cy="392" r="5.5" fill="#1a6cff">
      <animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="397"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
      font-size="14.5" fill="#e8eefc" font-weight="700">
      Open to internships &amp; contract work in hardware/AI
    </text>
    <text x="40" y="426"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
      font-size="12.5" fill="#3d5278">
      FPGA · embedded AI · RISC-V · RTL design · research collab
    </text>
  </g>

  <!-- Synthesis terminal scroll -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.41;0.46;1" dur="24s" fill="freeze"/>
    <g transform="translate(40,458)">
      <text x="0" y="9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="11" fill="#3d5278">$ synthesize --target slg47910 --opt area</text>
      <rect x="0" y="18" width="430" height="76" rx="4" fill="#080e1c"/>
      <g clip-path="url(#term-clip)" mask="url(#term-mask)">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; -760 0" dur="60s" repeatCount="indefinite"/>
          <text x="8" y="38"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
            font-size="10.5" fill="#1a6cff" opacity="0.7" xml:space="preserve">[INFO] Parsing RTL...   [INFO] Yosys synthesis running...   [WARN] BRAM init detected — using LUT fallback   [INFO] CLB LUT5s: 516/1120   [INFO] FFs: 230/1120   [OK] Bitstream: shrike_serv.bin   [INFO] Flashing RP2040...   [OK] SERV RISC-V: 1+2=3   [INFO] Parsing RTL...</text>
          <text x="8" y="56"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
            font-size="10.5" fill="#00d4ff" opacity="0.45" xml:space="preserve">[SIM]  ns-3 MLO: nodes=50  throughput=2.4Gbps   [SIM]  CAN firewall: 0 injections   [PASS] Wi-Fi 7 MLO link aggregation active   [SIM]  DNN inference: acc=94.2%   [SIM]  ns-3 MLO: nodes=50  throughput=2.4Gbps</text>
          <text x="8" y="74"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
            font-size="10.5" fill="#6a8ab8" opacity="0.35" xml:space="preserve">&gt;&gt;&gt; model.fit(X_train, y_train, epochs=50)   Epoch 1/50 loss:0.8432   Epoch 25/50 loss:0.1203   Epoch 50/50 loss:0.0612   val_acc:0.9420   Saved: densenet121.h5</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ═══ RIGHT PANEL — Code Editor ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.53;1" dur="24s" fill="freeze"/>
    <g transform="translate(638, 58)">
      <rect x="0" y="0" width="562" height="344" rx="8" fill="#080e1c" stroke="#1b2740" stroke-width="1"/>
      <rect x="0" y="0" width="562" height="32" rx="8" fill="#0d1525"/>
      <rect x="0" y="24" width="562" height="8" fill="#0d1525"/>
      <circle cx="18" cy="16" r="5" fill="#ff5f57" opacity="0.8"/>
      <circle cx="34" cy="16" r="5" fill="#ffbd2e" opacity="0.8"/>
      <circle cx="50" cy="16" r="5" fill="#28c840" opacity="0.8"/>
      <rect x="70" y="6" width="130" height="20" rx="3" fill="#141f38"/>
      <text x="80" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="11" fill="#6a8ab8">serv_shrike_top.v</text>
      <rect x="0" y="32" width="36" height="312" fill="#0a1220"/>
      <g clip-path="url(#code-clip)" mask="url(#code-mask)">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 32; 0 -580" dur="30s" repeatCount="indefinite"/>
          <!-- Line numbers -->
          <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2a3a56">
            <tspan x="10" y="14">1</tspan><tspan x="10" dy="16">2</tspan><tspan x="10" dy="16">3</tspan><tspan x="10" dy="16">4</tspan><tspan x="10" dy="16">5</tspan><tspan x="10" dy="16">6</tspan><tspan x="10" dy="16">7</tspan><tspan x="10" dy="16">8</tspan><tspan x="10" dy="16">9</tspan><tspan x="8" dy="16">10</tspan><tspan x="8" dy="16">11</tspan><tspan x="8" dy="16">12</tspan><tspan x="8" dy="16">13</tspan><tspan x="8" dy="16">14</tspan><tspan x="8" dy="16">15</tspan><tspan x="8" dy="16">16</tspan><tspan x="8" dy="16">17</tspan><tspan x="8" dy="16">18</tspan><tspan x="8" dy="16">19</tspan><tspan x="8" dy="16">20</tspan><tspan x="8" dy="16">21</tspan><tspan x="8" dy="16">22</tspan><tspan x="8" dy="16">23</tspan><tspan x="8" dy="16">24</tspan><tspan x="8" dy="16">25</tspan><tspan x="8" dy="16">26</tspan><tspan x="8" dy="16">27</tspan><tspan x="8" dy="16">28</tspan><tspan x="8" dy="16">29</tspan><tspan x="8" dy="16">30</tspan><tspan x="8" dy="16">31</tspan><tspan x="8" dy="16">32</tspan><tspan x="8" dy="16">33</tspan><tspan x="8" dy="16">34</tspan><tspan x="8" dy="16">35</tspan><tspan x="8" dy="16">36</tspan><tspan x="8" dy="16">37</tspan><tspan x="8" dy="16">38</tspan><tspan x="8" dy="16">39</tspan><tspan x="8" dy="16">40</tspan>
          </text>
          <!-- Code -->
          <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">
            <tspan x="44" y="14" fill="#7aa2f7">module</tspan><tspan fill="#e8eefc"> serv_shrike_top (</tspan>
            <tspan x="44" dy="16" fill="#c0caf5">  input  </tspan><tspan fill="#7aa2f7">wire       </tspan><tspan fill="#e8eefc">clk,</tspan>
            <tspan x="44" dy="16" fill="#c0caf5">  input  </tspan><tspan fill="#7aa2f7">wire       </tspan><tspan fill="#e8eefc">rst,</tspan>
            <tspan x="44" dy="16" fill="#c0caf5">  output </tspan><tspan fill="#7aa2f7">wire </tspan><tspan fill="#e8eefc">[1:0] result</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">);</tspan>
            <tspan x="44" dy="16"/>
            <tspan x="44" dy="16" fill="#565f89">  // SERV — world's smallest RISC-V CPU</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  wire </tspan><tspan fill="#e8eefc">[31:0] dbus_dat;</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  wire </tspan><tspan fill="#e8eefc">       dbus_we;</tspan>
            <tspan x="44" dy="16"/>
            <tspan x="44" dy="16" fill="#7aa2f7">  serv_top </tspan><tspan fill="#e8eefc">#(</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    .RESET_PC(32</tspan><tspan fill="#f7768e">'h0000_0000</tspan><tspan fill="#e8eefc">)</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">  ) cpu (</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    .clk       (clk),</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    .i_rst     (rst),</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    .o_dbus_dat(dbus_dat),</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    .o_dbus_we (dbus_we)</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">  );</tspan>
            <tspan x="44" dy="16"/>
            <tspan x="44" dy="16" fill="#565f89">  // Output 2-bit result via GPIO</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  assign </tspan><tspan fill="#e8eefc">result = dbus_we ? dbus_dat[1:0] : </tspan><tspan fill="#f7768e">2'b00</tspan><tspan fill="#e8eefc">;</tspan>
            <tspan x="44" dy="16"/>
            <tspan x="44" dy="16" fill="#7aa2f7">endmodule</tspan>
            <tspan x="44" dy="24" fill="#565f89">  // Systolic MAC for AI accelerator</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">module </tspan><tspan fill="#e8eefc">pe_mac (</tspan>
            <tspan x="44" dy="16" fill="#c0caf5">  input  </tspan><tspan fill="#e8eefc">signed [7:0] a, b,</tspan>
            <tspan x="44" dy="16" fill="#c0caf5">  output </tspan><tspan fill="#e8eefc">reg signed [15:0] acc</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">);</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  always </tspan><tspan fill="#e8eefc">@(*) acc = acc + a * b;</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">endmodule</tspan>
            <tspan x="44" dy="24" fill="#565f89">  // CAN firewall FSM</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">always </tspan><tspan fill="#e8eefc">@(</tspan><tspan fill="#c0caf5">posedge </tspan><tspan fill="#e8eefc">clk)</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  if </tspan><tspan fill="#e8eefc">(can_id === </tspan><tspan fill="#f7768e">11'h123</tspan><tspan fill="#e8eefc">)</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    state &lt;= BLOCKED;</tspan>
            <tspan x="44" dy="16" fill="#7aa2f7">  else</tspan>
            <tspan x="44" dy="16" fill="#e8eefc">    state &lt;= PASS;</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- ═══ RIGHT BOTTOM — GTKWave panel ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.62;1" dur="24s" fill="freeze"/>
